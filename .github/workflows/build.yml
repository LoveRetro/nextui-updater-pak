name: Build and Package

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross.git

      - name: Build with cross
        run: cross build --release --target=aarch64-unknown-linux-gnu

      - name: Package
        run: bash scripts/create_pak.sh

      - name: Upload pak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextui-updater-tg5040.zip
          path: Updater_tg5040.zip

      - name: Upload pak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextui-updater-tg5050.zip
          path: Updater_tg5050.zip

      - name: Upload pak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextui-updater-my355.zip
          path: Updater_my355.zip

      - name: Upload pak artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextui-updater-h700.zip
          path: Updater_h700.zip

      - name: Upload pakz artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextui.updater.pakz
          path: dist/
